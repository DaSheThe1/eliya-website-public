name: Release approved intake Worker to Cloudflare

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full reviewed private source commit to package and deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-worker-production
    steps:
      - name: Validate immutable workflow input
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          TRIGGER_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$TRIGGER_COMMIT" = "$SOURCE_COMMIT"
      - name: Check out exact reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate reviewed Worker candidate
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test ! -e worker/IMPLEMENTATION-BLOCKER.md
          if grep -rE 'REQUIRED_|PLACEHOLDER_' worker; then
            echo "Worker still contains an unresolved deployment marker." >&2
            exit 1
          fi
          pnpm worker:test
          mkdir "$RUNNER_TEMP/worker-package"
          WORKER_PACKAGE_APPROVED=YES \
          EXPECTED_COMMIT="$SOURCE_COMMIT" \
          WORKER_SOURCE_DIR="$GITHUB_WORKSPACE/worker" \
          WORKER_FILE_LIST="$GITHUB_WORKSPACE/deployment/static-pages-worker/worker-files.txt" \
          WORKER_ARTIFACT_DIR="$RUNNER_TEMP/worker-package/artifact" \
            ./deployment/static-pages-worker/package-worker.sh
      - name: Deploy exact packaged Worker after environment approval
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm --dir worker exec wrangler \
            --cwd "$RUNNER_TEMP/worker-package/artifact" deploy

      # This workflow deploys only. It does not make release:check pass.
      # Implement docs/PROVIDER-VERIFIER-TASK.md with authenticated GitHub and
      # Cloudflare API evidence before removing the fail-closed release blocker.
